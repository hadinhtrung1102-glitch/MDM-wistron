<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>QR Checkout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            /* ✅ Ảnh nền + màu nền dự phòng */
            background: #343454 url('bg-image.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px 30px;
            color: white;
        }

        .user-info {
            font-size: 18px;
            color: #F7ECCF;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            text-align: center;
        }

        .top-bar {
            width: 100%;
            max-width: 300px;
            background: #F4CA44;
            border-radius: 10px 10px 0 0;
            padding: 14px;
            text-align: center;
        }

        .top-bar-text {
            font-size: 15px;
            color: #333333;
            font-weight: 500;
        }

        .qr-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 300px;
            border-radius: 0 0 10px 10px;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
        }

        .datetime-text {
            font-size: 18px;
            color: #000000;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .qrcode-img {
            width: 220px;
            height: 220px;
            margin-bottom: 8px;
            object-fit: contain;
        }

        .refresh-text {
            font-size: 14px;
            color: #666666;
            margin: 6px 0 12px;
        }

        .blink {
            animation: blink-animation 2s steps(1, end) infinite;
        }

        @keyframes blink-animation {
            0%   { opacity: 1; }
            50%  { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .status-text {
            font-size: 24px;
            color: #22B559;
            font-weight: 500;
        }

        .timer-text {
            font-size: 22px;
            color: #22B559;
            font-weight: 600;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }

        .notice-text {
            font-size: 15px;
            color: #D8D8D8;
            line-height: 1.8;
            text-align: center;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <div class="user-info" id="user-info">V25060141(Hà Đình Trung)</div>

    <div class="top-bar">
        <div class="top-bar-text">将二维码对准扫描器刷码出场</div>
    </div>

    <div class="qr-card">
        <div class="datetime-text" id="datetime"></div>
        
        <img src="qrcode-img.jpg" alt="QR Code" class="qrcode-img">

        <div class="refresh-text">刷新二维码</div>

        <div class="status-text blink">已生效</div>
        <div class="timer-text" id="timer">00:00</div>
    </div>

    <div class="notice-text">
        尊敬的员工您好，您已进入企业涉密区<br>
        域，出于企业安全考虑，您的手机摄像头将被<br>
        禁止拍摄，感谢您的配合。
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id') || 'V25060141';
        const nameParam = urlParams.get('name') || 'Hà Đình Trung';
        document.getElementById('user-info').textContent = `${idParam}(${nameParam.trim()})`;

        function formatDateNow() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth()+1).padStart(2,'0');
            const day = String(d.getDate()).padStart(2,'0');
            const h = String(d.getHours()).padStart(2,'0');
            const min = String(d.getMinutes()).padStart(2,'0');
            const s = String(d.getSeconds()).padStart(2,'0');
            return `${y}-${m}-${day} ${h}:${min}:${s}`;
        }

        function updateTime() {
            document.getElementById('datetime').textContent = formatDateNow();
        }

        let secCount = 0;
        function formatTimer(s) {
            let m = Math.floor(s / 60);
            let s2 = s % 60;
            m = Math.min(m, 99);
            s2 = Math.min(s2, 99);
            return String(m).padStart(2,'0') + ':' + String(s2).padStart(2,'0');
        }
        function updateTimer() {
            document.getElementById('timer').textContent = formatTimer(secCount);
            secCount++;
            if (secCount > 5999) secCount = 0;
        }

        updateTime();
        updateTimer();
        setInterval(updateTime, 1000);
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
