<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二维码状态</title>
  
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <link rel="apple-touch-icon" href="icon.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="员工码">
  <meta name="application-name" content="员工码">
  
  <style>
    :root {
      --green: #82d58b;
      --text-dark: #222222;
      --gray-text: #666666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    body {
      min-height: 100vh;
      overflow: hidden;
      background-color: #242536;
      background-image: url("bg.JPG");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    .screen {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
    }

    /* ===== Tiêu đề trên cùng ===== */
    .header-title {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #f9d578;
      font-size: 22px;
      cursor: pointer;
      padding: 5px 10px;
    }
    .header-title:hover { background: rgba(255,255,255,0.05); }

    .top-time {
      position: absolute;
      top: 21.5%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--text-dark);
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    /* ===== Mã QR ===== */
    .qrcode-container {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .qrcode-img {
      width: 280px;
      height: 280px;
    }

    /* ===== Nút làm mới ===== */
    .refresh-btn {
      background: none;
      border: none;
      font-size: 16px;
      color: #333;
      cursor: pointer;
      margin-top: 15px;
    }
    .refresh-btn:hover { color: #0066cc; }

    .status-box {
      position: absolute;
      top: 61%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: center;
    }
    .status-label {
      color: var(--green);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 4px;
      animation: blink 2s steps(1, end) infinite;
    }
    .elapsed {
      color: var(--green);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 1px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    @keyframes blink {
      0%, 49.999% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .status-label { animation: none; }
    }
    .hidden-input { display: none; }
  </style>
</head>
<body>
  <main class="screen">

    <!-- 🔹 Tiêu đề trên cùng - Nhấn để sửa -->
    <div class="header-title" id="headerTitle">V25060141 (Hà Đình Trung)</div>
    <input type="text" id="titleInput" class="hidden-input" placeholder="Nhập nội dung...">

    <div class="top-time" id="realTime">2026-10-23 08:40:29</div>

    <!-- 🔹 Mã QR & Nút chuyển ảnh -->
    <div class="qrcode-container">
      <img src="qr1.jpg" alt="QR Code" class="qrcode-img" id="qrcodeImg">
      <button class="refresh-btn" id="qrNextBtn">刷新二维码</button>
    </div>

    <section class="status-box" aria-label="状态与计时">
      <div class="status-label">已生效</div>
      <div class="elapsed" id="elapsedTime">00:00:00</div>
    </section>
  </main>

  <script>
    // ===== 1. Đổi tiêu đề =====
    const headerTitle = document.getElementById('headerTitle');
    const titleInput = document.getElementById('titleInput');

    headerTitle.addEventListener('click', () => {
      titleInput.value = headerTitle.textContent;
      titleInput.style.display = 'block';
      titleInput.focus();
      titleInput.select();
      headerTitle.style.display = 'none';
    });

    const saveTitle = () => {
      if (titleInput.value.trim()) headerTitle.textContent = titleInput.value.trim();
      titleInput.style.display = 'none';
      headerTitle.style.display = 'block';
    };
    titleInput.addEventListener('blur', saveTitle);
    titleInput.addEventListener('keypress', e => e.key === 'Enter' && saveTitle());

    // ===== 2. Chuyển ảnh QR lần lượt =====
    const qrImages = ["qr1.jpg", "qr2.jpg", "qr3.jpg"]; // Danh sách ảnh
    let currentIndex = 0; // Bắt đầu từ ảnh đầu tiên
    const qrcodeImg = document.getElementById('qrcodeImg');
    const qrNextBtn = document.getElementById('qrNextBtn');

    qrNextBtn.addEventListener('click', () => {
      currentIndex++; // Tăng chỉ số
      if (currentIndex >= qrImages.length) currentIndex = 0; // Quay lại ảnh đầu nếu hết
      qrcodeImg.src = qrImages[currentIndex];
    });

    // ===== 3. Giữ nguyên hàm thời gian =====
    const realTimeEl = document.getElementById("realTime");
    const elapsedEl = document.getElementById("elapsedTime");
    function pad(v) { return String(v).padStart(2, "0"); }
    function getLocalDateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
    function updateRealTime() {
      const n = new Date();
      realTimeEl.textContent = `${getLocalDateKey(n)} ${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
    }
    function getStartTime(n) {
      const k = `statusTimerStart-${getLocalDateKey(n)}`;
      try {
        let s = localStorage.getItem(k);
        if (!s) { s = String(n.getTime()); localStorage.setItem(k, s); }
        return Number(s);
      } catch {
        if (!window.sst) window.sst = n.getTime();
        return window.sst;
      }
    }
    function updateElapsedTime() {
      const n = new Date(), s = getStartTime(n);
      const sec = Math.max(0, Math.floor((n.getTime() - s) / 1000));
      elapsedEl.textContent = `${pad(sec/3600|0)}:${pad((sec%3600)/60|0)}:${pad(sec%60)}`;
    }
    function tick() { updateRealTime(); updateElapsedTime(); }
    tick();
    setInterval(tick, 250);
  </script>
</body>
</html>
