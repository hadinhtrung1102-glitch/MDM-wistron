<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wistron QR Checkout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background: #343454;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 40px;
            color: white;
        }

        .user-info {
            font-size: 22px;
            color: #F7ECCF;
            letter-spacing: 0.5px;
            margin-bottom: 0;
            text-align: center;
        }

        .top-bar {
            width: 100%;
            max-width: 340px;
            background: #F4CA44;
            border-radius: 12px 12px 0 0;
            padding: 18px;
            text-align: center;
        }

        .top-bar-text {
            font-size: 17px;
            color: #333333;
            font-weight: 500;
        }

        .qr-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 340px;
            border-radius: 0 0 12px 12px;
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .datetime-text {
            font-size: 20px;
            color: #000000;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .qrcode-img {
            width: 260px;
            height: 260px;
            margin-bottom: 12px;
            object-fit: contain;
        }

        .refresh-text {
            font-size: 16px;
            color: #666666;
            margin: 8px 0 15px;
        }

        /* ✅ Chỉ áp dụng nhấp nháy cho chữ trạng thái */
        .blink {
            animation: blink-animation 2s steps(1, end) infinite;
        }

        @keyframes blink-animation {
            0%   { opacity: 1; }
            50%  { opacity: 0; }
            100% { opacity: 1; }
        }

        .status-text {
            font-size: 26px;
            color: #22B559;
            font-weight: 500;
        }

        .timer-text {
            font-size: 24px;
            color: #22B559;
            font-weight: 600;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }

        .notice-text {
            font-size: 17px;
            color: #D8D8D8;
            line-height: 1.8;
            text-align: center;
            max-width: 340px;
        }
    </style>
</head>
<body>

    <div class="user-info" id="user-info">V25060141(Hà Đình Trung)</div>

    <div class="top-bar">
        <div class="top-bar-text">将二维码对准扫描器刷码出场</div>
    </div>

    <div class="qr-card">
        <div class="datetime-text" id="datetime">2026-10-22 23:26:57</div>
        
        <img src="qrcode-img.png" alt="QR Code" class="qrcode-img">

        <div class="refresh-text">刷新二维码</div>

        <!-- ✅ Chỉ có chữ "已生效" nhấp nháy, đồng hồ không nhấp nháy -->
        <div class="status-text blink">已生效</div>
        <div class="timer-text" id="timer">00:55</div>
    </div>

    <div class="notice-text">
        尊敬的员工您好，您已进入企业涉密区<br>
        域，出于企业安全考虑，您的手机摄像头将被<br>
        禁止拍摄，感谢您的配合。
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id') || 'V25060141';
        const nameParam = urlParams.get('name') || 'Hà Đình Trung';
        document.getElementById('user-info').textContent = `${idParam}(${nameParam.trim()})`;

        const FIXED_DATETIME = "2026-10-22 23:26:57";
        document.getElementById('datetime').textContent = FIXED_DATETIME;

        let secCount = 55;
        function formatTimer(s) {
            let m = Math.floor(s / 60);
            let s2 = s % 60;
            m = Math.min(m, 99);
            s2 = Math.min(s2, 99);
            return String(m).padStart(2,'0') + ':' + String(s2).padStart(2,'0');
        }
        function updateTimer() {
            document.getElementById('timer').textContent = formatTimer(secCount);
            secCount++;
            if (secCount > 5999) secCount = 0;
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
