<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>二维码状态</title>
  
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <link rel="apple-touch-icon" href="icon.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="员工码">
  <meta name="application-name" content="员工码">
  
  <style>
    :root {
      --green: #82d58b;
      --text-dark: #222222;
      --gray-text: #666666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      touch-action: pan-x pan-y;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      min-height: 100vh;
      overflow: hidden;
      background-color: #242536;
      background-image: url("bg.JPG");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    .screen {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
    }
    .top-time {
      position: absolute;
      top: 21.5%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--text-dark);
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .status-box {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: center;
    }
    .qrcode-img {
      width: 220px;
      height: 220px;
      margin-bottom: 15px;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .refresh-link {
      color: var(--gray-text);
      font-size: 16px;
      text-decoration: none;
      margin-bottom: 12px;
      cursor: pointer;
      /* Bỏ hiệu ứng nhấn và ngăn sao chép */
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      pointer-events: auto;
    }
    .status-label {
      color: var(--green);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 4px;
      animation: blink 2s steps(1, end) infinite;
    }
    .elapsed {
      color: var(--green);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 1px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    @keyframes blink {
      0%, 49.999% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .status-label { animation: none; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="top-time" id="realTime">2026-10-23 08:40:29</div>
    <section class="status-box" aria-label="状态与计时">
      <img src="qr1.jpg" alt="QR Code" class="qrcode-img" id="qrCodeImg">
      <a class="refresh-link" id="refreshBtn">刷新二维码</a>
      <div class="status-label">已生效</div>
      <div class="elapsed" id="elapsedTime">00:00:00</div>
    </section>
  </main>
  <script>
    const realTimeEl = document.getElementById("realTime");
    const elapsedEl = document.getElementById("elapsedTime");
    const qrCodeImg = document.getElementById("qrCodeImg");
    const refreshBtn = document.getElementById("refreshBtn");
    
    const qrList = ["qr1.jpg", "qr2.jpg", "qr3.jpg"];
    let currentIndex = 0;
    refreshBtn.addEventListener("click", function(e) {
      e.preventDefault();
      currentIndex = (currentIndex + 1) % qrList.length;
      qrCodeImg.src = qrList[currentIndex];
    });
    function pad(value) {
      return String(value).padStart(2, "0");
    }
    function getLocalDateKey(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }
    function updateRealTime() {
      const now = new Date();
      realTimeEl.textContent =
        `${getLocalDateKey(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    function getStartTime(now) {
      const dateKey = getLocalDateKey(now);
      const storageKey = `statusTimerStart-${dateKey}`;
      try {
        let start = localStorage.getItem(storageKey);
        if (!start) {
          start = String(now.getTime());
          localStorage.setItem(storageKey, start);
        }
        return Number(start);
      } catch (error) {
        if (!window.sessionStartTime) window.sessionStartTime = now.getTime();
        return window.sessionStartTime;
      }
    }
    function updateElapsedTime() {
      const now = new Date();
      const start = getStartTime(now);
      const totalSeconds = Math.max(0, Math.floor((now.getTime() - start) / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      elapsedEl.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }
    function tick() {
      updateRealTime();
      updateElapsedTime();
    }
    tick();
    setInterval(tick, 250);
  </script>
</body>
</html>
