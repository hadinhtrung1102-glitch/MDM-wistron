
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>员工码</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f4f6;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #222;
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 18px;
      background: white;
    }

    .title {
      text-align: center;
      font-size: 25px;
      font-weight: 700;
      margin: 8px 0 28px;
    }

    .qr-box {
      display: flex;
      justify-content: center;
      margin: 20px auto;
    }

    #qr {
      width: 230px;
      height: 230px;
      object-fit: contain;
    }

    .info {
      margin-top: 24px;
      padding: 18px;
      background: #f7f8fa;
      border-radius: 10px;
    }

    .item {
      display: flex;
      align-items: flex-start;
      padding: 12px 0;
      gap: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .item:last-child {
      border-bottom: none;
    }

    .label {
      flex: 0 0 90px;
      color: #666;
    }

    .value {
      flex: 1;
      text-align: right;
      overflow-wrap: anywhere;
      font-weight: 600;
    }

    .status {
      margin-top: 22px;
      text-align: center;
      color: #16a34a;
      font-size: 18px;
      font-weight: 700;
    }

    .footer {
      margin-top: 35px;
      color: #999;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="page">
    <h1 class="title">员工码</h1>

    <div class="qr-box">
      <img id="qr" alt="员工二维码">
    </div>

    <section class="info">
      <div class="item">
        <span class="label">员工编号</span>
        <span class="value" id="employeeId">—</span>
      </div>

      <div class="item">
        <span class="label">员工姓名</span>
        <span class="value" id="employeeName">—</span>
      </div>
    </section>

    <div class="status">● 已生效</div>

    <div class="footer">
      Employee Code
    </div>
  </main>

  <script>
    const params = new URLSearchParams(
      window.location.search
    );

    const id = (params.get("id") || "").trim();
    const name = (params.get("name") || "").trim();

    document.getElementById("employeeId")
      .textContent = id || "—";

    document.getElementById("employeeName")
      .textContent = name || "—";

    // QR code chứa ID và tên, không chứa dữ liệu bí mật.
    const qrData = JSON.stringify({ id, name });

    document.getElementById("qr").src =
      "https://api.qrserver.com/v1/create-qr-code/" +
      "?size=300x300&data=" +
      encodeURIComponent(qrData);
  </script>
</body>
</html>
