<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Wistron - Check-in</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .header-info {
            margin-bottom: 20px;
        }

        .id-display {
            font-size: 18px;
            color: #a0d2ff;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .name-display {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 25px;
        }

        .datetime-display {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .qrcode-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 30px;
        }

        #qrcode {
            display: block;
        }

        .timer-label {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 10px;
        }

        .counter-display {
            font-size: 48px;
            font-weight: 700;
            color: #4ade80;
            letter-spacing: 4px;
            font-variant-numeric: tabular-nums;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 13px;
            color: #888888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-info">
            <div class="id-display" id="id-text">ID: V25060141</div>
            <div class="name-display" id="name-text">Hà Đình Trung</div>
        </div>

        <!-- Ngày giờ hiện tại hiển thị trên mã QR -->
        <div class="datetime-display" id="current-datetime">2026-10-22 23:15:26</div>

        <!-- Mã QR -->
        <div class="qrcode-container">
            <canvas id="qrcode"></canvas>
        </div>

        <!-- Bộ đếm màu xanh lá -->
        <div class="timer-label">Thời gian hoạt động</div>
        <div class="counter-display" id="counter">00:00:00</div>
    </div>

    <div class="footer-note">
        Dữ liệu cập nhật theo thời gian thực
    </div>

    <script>
        // === Lấy tham số từ URL ===
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id') || 'V25060141';
        const nameParam = urlParams.get('name') || 'Hà Đình Trung';
        
        document.getElementById('id-text').textContent = 'ID: ' + idParam;
        document.getElementById('name-text').textContent = nameParam.trim();

        // === Cập nhật ngày giờ hiện tại ===
        function formatDateTime(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const h = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            return `${y}-${m}-${d} ${h}:${min}:${s}`;
        }

        function updateDateTime() {
            const now = new Date();
            const dtStr = formatDateTime(now);
            document.getElementById('current-datetime').textContent = dtStr;
            // Cập nhật mã QR với giá trị thời gian thực
            generateQRCode(dtStr);
        }

        // === Tạo mã QR ===
        let qrCanvas = document.getElementById('qrcode');
        let qrInstance = null;
        
        function generateQRCode(text) {
            if (qrInstance) qrInstance.clear();
            QRCode.toCanvas(qrCanvas, text, {
                width: 200,
                margin: 2,
                color: {
                    dark: '#000000',
                    light: '#ffffff'
                }
            }, function (error) {
                if (error) console.error(error)
            });
        }

        // === Bộ đếm: 00:00:00 -> 99:99:99 ===
        let totalSeconds = 0;

        function formatCounter(totalSec) {
            let hours = Math.floor(totalSec / 3600);
            let minutes = Math.floor((totalSec % 3600) / 60);
            let seconds = totalSec % 60;

            // Giới hạn tối đa 99:99:99
            hours = Math.min(hours, 99);
            minutes = Math.min(minutes, 99);
            seconds = Math.min(seconds, 99);

            return String(hours).padStart(2, '0') + ':' +
                   String(minutes).padStart(2, '0') + ':' +
                   String(seconds).padStart(2, '0');
        }

        function updateCounter() {
            document.getElementById('counter').textContent = formatCounter(totalSeconds);
            totalSeconds++;
            // Khi đạt 99:99:99 thì reset về 00:00:00
            if (totalSeconds > 999999) {
                totalSeconds = 0;
            }
        }

        // === Khởi chạy ===
        updateDateTime();
        updateCounter();
        
        setInterval(updateDateTime, 1000); // Cập nhật ngày giờ mỗi giây
        setInterval(updateCounter, 1000);   // Đếm mỗi giây
    </script>
</body>
</html>
